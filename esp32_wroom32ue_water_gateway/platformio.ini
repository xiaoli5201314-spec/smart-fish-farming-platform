; ESP32-WROOM-32UE fish pond water gateway

[platformio]
default_envs = pond1

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient

[env:pond1]
board = esp32dev
build_flags = -D POND_NUMBER=1

[env:pond2]
board = esp32dev
build_flags = -D POND_NUMBER=2

[env:pond3]
board = esp32dev
build_flags = -D POND_NUMBER=3
